<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VK Авторизация</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
        }
        #vkid-container {
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Авторизация ВКонтакте</h1>
        <p>Войдите через VK ID для продолжения работы</p>
        
        <div id="vkid-container">
            <div class="loading"></div>
            <span>Загрузка виджета авторизации...</span>
        </div>
        
        <div id="status" class="status info" style="display: none;"></div>
    </div>

    <script src="https://unpkg.com/@vkid/sdk@<3.0.0/dist-sdk/umd/index.js"></script>
    <script type="text/javascript">
        // Глобальная переменная для хранения результата
        window.authResult = null;
        window.authError = null;

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            statusDiv.style.display = 'block';
        }

        function vkidOnSuccess(data) {
            console.log('Успешная авторизация:', data);
            window.authResult = data;
            window.authError = null;
            showStatus('✅ Авторизация успешна! Можно закрыть это окно.', 'success');
        }

        function vkidOnError(error) {
            console.error('Ошибка авторизации:', error);
            window.authResult = null;
            window.authError = error;
            showStatus('❌ Ошибка авторизации: ' + (error.message || error), 'error');
        }

        if ('VKIDSDK' in window) {
            const VKID = window.VKIDSDK;

            VKID.Config.init({
                app: 54819250,
                redirectUrl: 'https://ParsingMyTest.com',
                responseMode: VKID.ConfigResponseMode.Callback,
                source: VKID.ConfigSource.LOWCODE,
                scope: '',
            });

            const floatingOneTap = new VKID.FloatingOneTap();

            floatingOneTap.render({
                container: document.getElementById('vkid-container'),
                appName: 'VK Community Finder',
                showAlternativeLogin: true
            })
            .on(VKID.WidgetEvents.ERROR, vkidOnError)
            .on(VKID.FloatingOneTapInternalEvents.LOGIN_SUCCESS, function (payload) {
                const code = payload.code;
                const deviceId = payload.device_id;

                showStatus('⏳ Обмен кода на токен...', 'info');

                VKID.Auth.exchangeCode(code, deviceId)
                    .then(vkidOnSuccess)
                    .catch(vkidOnError);
            });
        } else {
            showStatus('❌ Не удалось загрузить VK ID SDK. Проверьте интернет-соединение.', 'error');
        }
    </script>
</body>
</html>
